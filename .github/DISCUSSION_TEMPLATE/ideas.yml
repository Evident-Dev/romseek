body:
  - type: markdown
    attributes:
      value: |
        Ideas start here so others can weigh in. Popular, well-defined ones become issues.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should RomSeek do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The problem it solves for you, or how you'd use it.
    validations:
      required: true
