body:
  - type: markdown
    attributes:
      value: |
        Ideas start here so others can weigh in. Popular, well-defined ones become issues.

        **No piracy requests.** Don't share or ask for ROMs, BIOS files, keys or download sites; those posts are removed. See [Legal](https://github.com/Evident-Dev/romseek/blob/main/docs/legal.md).
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should RomSeek do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The problem it solves for you, or how you'd use it.
    validations:
      required: true
