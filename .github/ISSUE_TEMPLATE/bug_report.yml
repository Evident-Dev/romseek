name: Bug report
description: Something in RomSeek doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Check the [troubleshooting guide](https://github.com/Evident-Dev/romseek/blob/main/docs/troubleshooting.md) first. Remove API keys, tokens and IP addresses before you paste anything.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Search for ...
        2. Click Grab ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: RomSeek version
      description: Run `git -C romseek rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: RomM, Prowlarr and qBittorrent versions
      placeholder: RomM 5.3.0, Prowlarr 1.x, qBittorrent 5.x
  - type: dropdown
    id: scan
    attributes:
      label: Virus scanning
      options:
        - Built-in checks only
        - ClamAV with arr-download-malware-guard
        - My own scanner
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker logs romseek --tail 100`.
      render: text
